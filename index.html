<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Font CSS loads without blocking render; display=swap shows fallback text until it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" /></noscript>
    <title>Whose Debut?</title>
    <meta name="description" content="Fresh releases from Reno-area artists, every week." />
    <!-- Link previews (iMessage, Discord, Slack, socials). Scrapers need absolute URLs; update these if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whose Debut?" />
    <meta property="og:title" content="Whose Debut?" />
    <meta property="og:description" content="Fresh releases from Reno-area artists, every week." />
    <meta property="og:url" content="https://whosedebut.com/" />
    <meta property="og:image" content="https://whosedebut.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Whose Debut? — a vinyl record beside the words Whose Debut?" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://whosedebut.com/og-image.png" />
    <!-- Critical styles for the pre-JS loading shell below; mirrors loadingScreen.scss. -->
    <style>
      body { margin: 0; background: #FAF5F0; }
      .loadingScreen { width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #FAF5F0; }
      .loadingTurntable { position: relative; width: 112px; height: 92px; box-sizing: border-box; border: 3px solid #111; border-radius: 10px; background: #EDE4DA; box-shadow: 4px 4px 0 #111; }
      .loadingRecord { position: absolute; top: 8px; left: 8px; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, #FAF5F0 0 2px, #E4572E 2.5px 11px, transparent 11.5px), conic-gradient(transparent 0 30deg, rgba(255,255,255,0.22) 50deg, transparent 70deg 210deg, rgba(255,255,255,0.22) 230deg, transparent 250deg), repeating-radial-gradient(circle, #111 0 1.5px, #2a2a2a 1.5px 3px); animation: loadingSpin 1.6s linear infinite; }
      .loadingTonearm { position: absolute; top: 10px; right: 10px; width: 4px; height: 52px; border-radius: 2px; background: #111; transform-origin: 50% 2px; transform: rotate(28deg); }
      .loadingTonearm::before { content: ''; position: absolute; top: -5px; left: -5px; width: 14px; height: 14px; border-radius: 50%; background: #111; }
      .loadingTonearm::after { content: ''; position: absolute; bottom: -4px; left: -3px; width: 10px; height: 8px; border-radius: 2px; background: #111; }
      .loadingText { margin: 0; font-family: 'Do Hyeon', sans-serif; font-size: 1.25rem; letter-spacing: 0.1em; color: #6c757d; }
      @keyframes loadingSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Painted immediately from HTML; React replaces it on first render. -->
    <div id="root"><div class="loadingScreen"><div class="loadingTurntable"><div class="loadingRecord"></div><div class="loadingTonearm"></div></div><p class="loadingText">Loading...</p></div></div>
    <script type="module" src="/src/Index.tsx"></script>
  </body>
</html>
